name: CI

# Every push and pull request: the unit tests, the packages of both browser
# families as downloadable artifacts, and the built extension in a real
# Chromium and a real Firefox against a mock of Coddy. The jobs run side by
# side; "CI passed" waits for all of them. Releases are tag-on-merge.yaml and
# release.yaml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - run: npm run build
      - name: The version of package.json is the version of both manifests
        run: |
          node -e "
            const v = require('./package.json').version;
            for (const b of ['chrome', 'firefox'])
              if (require('./dist/' + b + '/manifest.json').version !== v) { console.error(b + ' manifest version'); process.exit(1); }
          "
      # One artifact per browser family holding the built extension itself,
      # so the archive GitHub hands out is the package: download one from the
      # run's summary and install it as the README says.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coddy-for-browser-chrome
          path: dist/chrome
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coddy-for-browser-firefox
          path: dist/firefox

  e2e-chromium:
    name: Real Chromium against a mock of Coddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run build
      # The tools come from package-lock.json; no install script runs.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CODDY_SCREENSHOT_DIR: screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: screenshots
          if-no-files-found: ignore

  e2e-firefox:
    name: Real Firefox against a mock of Coddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        id: firefox
        with:
          firefox-version: latest
      - run: npm run build
      - run: npm ci --ignore-scripts
      - run: npm run e2e:firefox
        env:
          CODDY_FIREFOX_PATH: ${{ steps.firefox.outputs.firefox-path }}

  passed:
    name: CI passed
    if: always()
    needs: [build, e2e-chromium, e2e-firefox]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
