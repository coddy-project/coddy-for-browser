# Releases an X.Y.Z tag. One job builds the packages with that version in
# both manifests; three jobs take them from there, each on its own:
#   - GitHub release: attaches the packages to the tag's release;
#   - Chrome Web Store: uploads the Chrome package and submits it for review;
#   - addons.mozilla.org: submits the Firefox build to the public listing.
# The stores publish the version once their review passes. A job that failed
# is run again alone (Re-run failed jobs, or the job's own re-run button); it
# takes the packages of the first run, and a store job skips a version the
# store already holds. tag-on-merge.yaml calls this workflow after tagging a
# merged pull request; a tag pushed by hand runs it too.
#
# A store job runs only when its repository variable is true, CWS_PUBLISH
# for the Chrome Web Store and AMO_PUBLISH for addons.mozilla.org; otherwise
# it is skipped and the release goes out without that store. A store job whose
# credentials are not set says what is missing and passes (README, Releases):
#   - Chrome Web Store: secrets CWS_CLIENT_ID, CWS_CLIENT_SECRET,
#     CWS_REFRESH_TOKEN and variables CWS_PUBLISHER_ID, CWS_EXTENSION_ID;
#   - addons.mozilla.org: secrets AMO_JWT_ISSUER, AMO_JWT_SECRET.

name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CWS_CLIENT_ID:
        required: false
      CWS_CLIENT_SECRET:
        required: false
      CWS_REFRESH_TOKEN:
        required: false
      AMO_JWT_ISSUER:
        required: false
      AMO_JWT_SECRET:
        required: false
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The tag is the version of the build
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The tag must be X.Y.Z, got $TAG" >&2; exit 1; }
          npm version --no-git-tag-version --allow-same-version "$TAG"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/coddy-for-browser-*.zip
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          # The notes name only the stores this release is sent to.
          CWS_PUBLISH: ${{ vars.CWS_PUBLISH }}
          AMO_PUBLISH: ${{ vars.AMO_PUBLISH }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/coddy-for-browser-*.zip --clobber
          else
            gh release create "$TAG" dist/coddy-for-browser-*.zip --verify-tag \
              --title "Coddy for Browser $TAG" --notes-file notes.md
          fi

  chrome-web-store:
    name: Chrome Web Store
    needs: build
    if: vars.CWS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Upload and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-chrome.mjs "dist/coddy-for-browser-chrome-$TAG.zip" "$TAG"

  firefox-add-ons:
    name: addons.mozilla.org
    needs: build
    if: vars.AMO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      # web-ext comes from package-lock.json; no install script runs.
      - run: npm ci --ignore-scripts
      - name: Unpack the Firefox build
        run: unzip -q "dist/coddy-for-browser-firefox-$TAG.zip" -d dist/firefox
      - name: Submit to the listing for review
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: node scripts/sign.mjs listed
