<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coddy for Browser</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <img src="icons/icon-32.png" alt="" width="20" height="20" />
      <strong>Coddy for Browser</strong>
      <span id="status" class="status" role="status">Loading&hellip;</span>
    </header>
    <main>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="approvals" aria-live="assertive"></section>
      <section id="setup" class="card" hidden>
        <p>Connect the extension to your Coddy server to let its chats use this browser.</p>
        <button id="open-setup" class="primary" type="button">Set up</button>
      </section>
      <section id="current" class="card" aria-live="polite"></section>
      <section id="chats-section" hidden>
        <h2>Chats using this browser</h2>
        <ul id="chats" class="list"></ul>
      </section>
    </main>
    <footer class="bar actions">
      <button id="stop" class="danger" type="button" title="Cancel every action and withdraw every tab">Stop Coddy</button>
      <button id="settings" type="button">Settings</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
