<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coddy</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="panel">
    <header class="bar panel-bar">
      <img src="icons/icon-32.png" alt="" width="18" height="18" />
      <span id="tabbar" class="tabbar" aria-live="polite"></span>
      <button id="settings" class="icon" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
          />
        </svg>
      </button>
    </header>
    <p id="error" class="error" role="alert" hidden></p>
    <div class="stage">
      <iframe id="webui" title="Coddy" hidden></iframe>
      <section id="approvals" aria-live="assertive"></section>
      <section id="offline" class="card offline" hidden>
        <p id="offline-text">Not connected to Coddy.</p>
        <button id="open-settings" class="primary" type="button">Settings</button>
      </section>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
