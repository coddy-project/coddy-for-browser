# Trivy's secret scanner, read by default from the root. Its builtin allow
# rules skip test files (any path with "test" in it, so tests/ and every
# *.test.mjs), anything with "example" in its path and Markdown, which here
# are code and documentation a pull request can bring a credential in like
# any other file.
disable-allow-rules:
  - tests
  - examples
  - markdown
